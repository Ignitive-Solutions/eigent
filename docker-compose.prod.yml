services:
  # ── Reverse proxy (only public-facing service) ──────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - app_network
    depends_on:
      - server

  # ── API server ───────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - database_url=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eigent
      - redis_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - celery_broker_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - celery_result_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - SESSION_REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ── Backend orchestration worker ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # NOT exposed publicly — only reachable inside app_network
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - SERVER_ACTION_URL=http://server:8001/api/v1/local-action
    depends_on:
      - server
    networks:
      - app_network

  # ── Celery worker ────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.core.celery worker
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - database_url=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eigent
      - redis_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - celery_broker_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - celery_result_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - SESSION_REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ── Celery beat scheduler ────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.core.celery beat
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - database_url=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eigent
      - redis_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - celery_broker_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - celery_result_url=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - SESSION_REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eigent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eigent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  caddy_data:

networks:
  app_network:
    driver: bridge
    internal: false
